services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: recoverai
      POSTGRES_USER: recoverai
      POSTGRES_PASSWORD: recoverai
    ports:
      - "5432:5432"
    volumes:
      - recoverai_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build: ./backend
    env_file: ./backend/.env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    depends_on:
      - postgres
      - redis

  beat:
    build: ./backend
    env_file: ./backend/.env
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_DEMO_API_KEY=recoverai-demo-key
    depends_on:
      - backend

volumes:
  recoverai_postgres:
